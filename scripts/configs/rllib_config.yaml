algorithm: PPO

checkpoint_frequency: 20

stop:
    time_total_s: 30 #6300

config:
    horizon: 500
    env: godot
    env_config:
        env_path: 'godot_export/env.exe' # Set your env path here (exported executable from Godot) - e.g. env_path: 'env_path.exe' on Windows
        action_repeat: null # Doesn't need to be set here, you can set this in sync node in Godot editor as well
        show_window: false # Displays game window while training. Might be faster when false in some cases, turning off also reduces GPU usage if you don't need rendering.
        speedup: 30 # Speeds up Godot physics

    framework: torch # ONNX models exported with torch are compatible with the current Godot RL Agents Plugin

    lr: 0.0003
    lambda: 0.95
    gamma: 0.99

    vf_loss_coeff: 0.5
    vf_clip_param: .inf
    #clip_param: 0.2
    entropy_coeff: 0.0001
    entropy_coeff_schedule: null
    #grad_clip: 0.5

    normalize_actions: True
    clip_actions: True # During onnx inference we simply clip the actions to [-1.0, 1.0] range, set here to match

    rollout_fragment_length: 32
    sgd_minibatch_size: 128
    num_workers: 10
    num_envs_per_env_runner: 1 # This will be set automatically if not multi-agent. If multi-agent, changing this changes how many envs to launch per worker.
    # The value below needs changing per env
    # Basic calculation for this value can be rollout_fragment_length * num_workers * num_envs_per_env_runner (how many AIControllers you have if not multi_agent, otherwise the value you set)
    train_batch_size: 320

    num_sgd_iter: 4
    batch_mode: truncate_episodes

    num_gpus: 1
    model:
        vf_share_layers: False
        fcnet_hiddens: [128, 128, 128]
